[project]
name = "leaderboard"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "dev", email = "asqarservis00001@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "celery>=5.6.3",
    "django>=6.1.2",
    "django-cors-headers>=4.9.0",
    "django-jazzmin>=3.0.5",
    "djangorestframework>=3.18.3",
    "djangorestframework-simplejwt>=5.5.1",
    "djangorestframework-stubs>=3.18.1",
    "dotenv>=0.9.9",
    "drf-spectacular>=0.30.0",
    "google-genai>=2.33.0",
    "orjson>=3.13.0",
    "pillow>=13.0.0",
    "psycopg[binary]>=3.3.6",
    "pytest-django>=4.14.0",
]

[project.scripts]
leaderboard = "leaderboard:main"

[build-system]
requires = ["uv_build>=0.12.17,<0.13.0"]
build-backend = "uv_build"
